[package]
name = "soulmate"
version = "0.16.0-rc.1"
edition = "2021"
rust-version = "1.75"
description = "Bounded coding-agent handoffs and memory governance evidence"
license = "MIT"
repository = "https://github.com/veyndrasystems/soulmate"

[dependencies]
# serde/serde_json preserve the public JSON configuration, receipt, and JSONL schemas.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# sha2 provides the evidence hashes used by the existing append-only protocols.
sha2 = "0.10"
# chrono supplies portable, normalized ISO-8601 timestamps; std has no formatter.
chrono = { version = "0.4", default-features = true, features = ["clock"] }
# libc exposes POSIX O_NOFOLLOW and PID probes that std does not model.
libc = "0.2"
[profile.release]
strip = true
lto = true
codegen-units = 1
